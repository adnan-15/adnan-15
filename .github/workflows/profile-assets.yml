name: Refresh profile assets

on:
  schedule:
    - cron: "30 0 * * *" # daily at 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    # Only changes that can alter the output start a run. The bot commit below touches
    # assets/generated, assets/*.svg and README.md only, none of which are listed here, and it is
    # pushed with GITHUB_TOKEN (pushes made with it never start another run), so it cannot loop.
    paths:
      - "config/**"
      - ".github/scripts/**"
      - ".github/workflows/profile-assets.yml"
      - "assets/icons/**"

permissions:
  contents: write # commit regenerated assets back to the repository

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static art (terminal card, tech stack, dividers, buttons)
        run: python .github/scripts/make_static.py

      - name: Build live panels (stats, contribution scene, project cards)
        # Exits non-zero when GitHub returns no data at all, so a broken run is red, never silently green.
        # Partial data produces warning annotations and a run summary listing exactly what failed and why.
        run: python .github/scripts/make_stats.py
        env:
          # Optional: a classic token with `read:user` stored as the STATS_TOKEN secret adds private
          # contributions. Without it the built-in GITHUB_TOKEN is used (public activity only).
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render README.md from the template and config
        run: python .github/scripts/make_readme.py

      - name: Commit regenerated files
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile assets [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
